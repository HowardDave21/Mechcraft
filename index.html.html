<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MECHCRAFT — Aircraft MRO Manager</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap">
<style>
:root{
  --bg:#10161d; --panel:#1a232c; --panel2:#212c37; --line:#30414f;
  --text:#e7edf2; --muted:#7f97a8; --amber:#ff7a3d; --cyan:#45d6c2;
  --good:#4fe0a0; --warn:#ff7a3d; --bad:#ff5c6a;
  --headfont:'Oswald','Segoe UI',sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef1f4; --panel:#ffffff; --panel2:#f3f6f8; --line:#ccd6de;
    --text:#172029; --muted:#5b6b7d;
  }
  body{
    background:
      repeating-linear-gradient(0deg, transparent 0 39px, rgba(20,40,60,.045) 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, rgba(20,40,60,.045) 39px 40px),
      var(--bg);
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:
    repeating-linear-gradient(0deg, transparent 0 39px, rgba(255,255,255,.028) 39px 40px),
    repeating-linear-gradient(90deg, transparent 0 39px, rgba(255,255,255,.028) 39px 40px),
    var(--bg);
  color:var(--text);
  font:14px/1.4 "Segoe UI", system-ui, sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.wrap{display:flex;flex-direction:column;height:100vh}
header{
  display:flex;align-items:center;gap:16px;padding:10px 16px;
  background:var(--panel);border-bottom:3px solid var(--amber);flex-wrap:wrap;
  box-shadow:0 2px 0 rgba(0,0,0,.25);
}
header b.logo{
  color:var(--text);letter-spacing:3px;font-family:var(--headfont);
  font-size:16px;font-weight:700;text-transform:uppercase;
  padding:4px 10px;border:2px solid var(--amber);border-radius:2px;
}
.stat{display:flex;flex-direction:column;font-size:11px;color:var(--muted);min-width:60px}
.stat b{font-size:15px;color:var(--text);font-family:Consolas,monospace}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.cyan{color:var(--cyan)}.amber{color:var(--amber)}
.speedbar{display:flex;gap:4px;margin-left:auto}
.speedbar button,.tabs button{
  background:var(--panel2);border:1px solid var(--line);color:var(--text);
  padding:6px 10px;border-radius:2px;cursor:pointer;font-size:12px;
}
.speedbar button.on,.tabs button.on{background:var(--amber);color:#1a0d00;border-color:var(--amber)}
.body{display:flex;flex:1;min-height:0}
nav.tabs{display:flex;flex-direction:column;gap:4px;padding:10px;background:var(--panel);border-right:1px solid var(--line);min-width:150px;overflow-y:auto}
nav.tabs button{text-align:left;border-radius:2px}
nav.tabs button.on{border-left:3px solid var(--cyan)}
main{flex:1;overflow-y:auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--cyan);border-radius:3px;padding:12px 14px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:13px;color:var(--amber);font-family:var(--headfont);letter-spacing:1px;text-transform:uppercase}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.bar{height:8px;background:var(--panel2);border-radius:5px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--cyan)}
.bar.red i{background:var(--bad)}
.bar.amber i{background:var(--amber)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
button.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:2px;cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
button.btn:hover{border-color:var(--cyan);color:var(--cyan)}
button.btn:disabled{opacity:.4;cursor:not-allowed}
button.btn.primary{background:var(--amber);color:#1a0d00;border-color:var(--amber);font-weight:700}
button.btn.danger{border-color:var(--bad);color:var(--bad)}
.pill{font-size:10px;padding:2px 7px;border-radius:2px;background:var(--panel2);border:1px solid var(--line);text-transform:uppercase;letter-spacing:.3px}
.pill.cert{color:var(--cyan);border-color:var(--cyan)}
.muted{color:var(--muted)}
.log{font-family:Consolas,monospace;font-size:12px;max-height:230px;overflow-y:auto}
.log div{padding:2px 0;border-bottom:1px solid var(--line)}
.log .bad{color:var(--bad)} .log .good{color:var(--good)} .log .warn{color:var(--amber)}
select,input[type=text],input[type=number]{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:5px;border-radius:2px}
.toast-wrap{position:fixed;top:10px;right:10px;z-index:50;display:flex;flex-direction:column;gap:6px;max-width:300px}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--cyan);padding:8px 10px;border-radius:2px;font-size:12.5px;animation:in .2s}
.toast.bad{border-left-color:var(--bad)} .toast.good{border-left-color:var(--good)} .toast.warn{border-left-color:var(--amber)}
@keyframes in{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}
h2.title{margin:4px 0 10px;color:var(--amber);font-family:var(--headfont);letter-spacing:1px;text-transform:uppercase;font-size:19px;border-bottom:1px solid var(--line);padding-bottom:6px}
.stars{color:var(--amber);letter-spacing:1px}
.emptybay{color:var(--muted);text-align:center;padding:14px 0}
.hangarmap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;margin-bottom:14px}
.floor{background:repeating-linear-gradient(45deg, var(--panel2) 0 2px, transparent 2px 14px);border:2px solid var(--line);border-radius:4px;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;flex:2;min-width:260px}
.baycell{border:2px dashed var(--line);border-radius:3px;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-size:10.5px;color:var(--muted)}
.baycell .ac{font-size:26px}
.baycell.busy{border-style:solid;border-color:var(--cyan);background:rgba(69,214,194,.08)}
.baycell.broken{border-color:var(--bad);background:rgba(255,92,106,.08)}
.baycell .num{position:absolute;top:3px;left:5px;font-family:var(--headfont);color:var(--line);font-size:11px}
.apron{flex:1;min-width:180px;border:2px dashed var(--line);border-radius:4px;padding:10px;background:var(--panel2)}
.apron .plane{display:inline-block;margin:3px;padding:4px 7px;border-radius:2px;background:var(--panel);border:1px solid var(--line);font-size:11px}
.apron .plane.aog{border-color:var(--bad);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
table th{text-align:left;color:var(--muted);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
table td{padding:4px 6px;border-bottom:1px solid var(--line)}
table td.n{text-align:right}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <b class="logo">✈ MECHCRAFT</b>
    <div class="stat">Day<b id="s-day">1</b></div>
    <div class="stat">Time<b id="s-time">06:00</b></div>
    <div class="stat">Cash<b id="s-cash" class="good">£0</b></div>
    <div class="stat">Reputation<b id="s-rep">50</b></div>
    <div class="stat">Rank<b id="s-rank" class="cyan">—</b></div>
    <div class="stat">Checks done<b id="s-jobs">0</b></div>
    <div class="speedbar">
      <button id="p-pause" class="btn">❚❚</button>
      <button id="p-1" class="btn">1×</button>
      <button id="p-2" class="btn">2×</button>
      <button id="p-4" class="btn">4×</button>
    </div>
  </header>
  <div class="body">
    <nav class="tabs" id="tabs"></nav>
    <main id="main"></main>
  </div>
</div>
<div class="toast-wrap" id="toasts"></div>
<script>
const RANKS = ["Apprentice AME","Licensed AME","Senior AME","Chief Inspector","Station Manager","Director of Maintenance"];
const MILESTONES = [
  {jobs:8,  rep:52, bonus:15000,  text:"Eight clean sign-offs and no comebacks. The chief inspector trusts your stamp now."},
  {jobs:25, rep:62, bonus:50000,  unlock:"powerplant", text:"Powerplant rating approved. Engine work is yours to take on."},
  {jobs:55, rep:70, bonus:150000, unlock:"avionics", wideBay:true, text:"Avionics rating signed off, and the hangar's been cleared for wide-body C-checks."},
  {jobs:110,rep:78, bonus:400000, text:"Full MRO capability across the fleet types you see. The regulator's stopped sending surprise visits."},
  {jobs:220,rep:85, bonus:1000000,text:"You run the station now. The name on the hangar door might as well be yours."}
];
const JOB_TYPES = {
  LINE: {name:"Line Check", hours:2,  pay:900,  cert:null,        parts:1, aircraft:["Cessna 208","Dash 8-300"]},
  A:    {name:"A-Check",    hours:14, pay:4200, cert:"airframe",  parts:4, aircraft:["737-800","A320"]},
  ENG:  {name:"Engine Inspection", hours:20, pay:7500, cert:"powerplant", parts:6, aircraft:["737-800","A320","E190"]},
  AVI:  {name:"Avionics Upgrade",  hours:10, pay:5200, cert:"avionics",   parts:3, aircraft:["A320","E190","Dash 8-300"]},
  C:    {name:"C-Check", hours:50, pay:19000, cert:"airframe", wide:true, parts:12, aircraft:["777-200","A330"]},
  AOG:  {name:"AOG Emergency", hours:4, pay:9500, cert:null, parts:2, deadline:16, aircraft:["737-800","A320","E190"]}
};
const FIRST = ["Priya","Sam","Deon","Aisha","Chidi","Lewis","Mei","Owen","Rhys","Gwen","Farid","Imogen","Niamh","Tomasz","Uma","Jas"];
const LAST = ["Okafor","Nowak","Hughes","Singh","Patel","Walsh","Reid","Evans","Gill","Kaur","Taylor","Iqbal","Lloyd"];
const AIRLINES = ["Meridian Air","Coastal Express","AtlasJet","Northline Regional","Harbour Wings","Solstice Air"];
const RIVAL_SEED = [["Falcon MRO",3,55],["Ironwing Services",6,68],["Prairie Air Maintenance",2,40]];
const EVENTS = [
  {w:3, text:a=>`Tool breakdown at Bay ${a}. It's out of service until repaired.`, fn:s=>{const cand=s.bays.filter(b=>!b.broken&&!b.job);if(!cand.length)return null;const b=pick(cand);b.broken=true;b.repairIn=6+rnd(0,8);return b.id;}},
  {w:2, text:()=>"A ramp inspector has turned up unannounced for a spot audit.", fn:s=>{
      const pass = Math.random()*100 < s.rep;
      if(pass){s.rep=Math.min(100,s.rep+2);addLog("good","Audit passed clean. Reputation +2.");}
      else{const fine=Math.round(2000+Math.random()*4000);s.cash-=fine;s.ledger.misc-=fine;s.rep=Math.max(0,s.rep-4);addLog("bad",`Audit found paperwork gaps. Fined ${money(fine)}, reputation -4.`);}
      return "handled";
    }},
  {w:2, text:n=>`${n} has called in sick and won't be in today.`, fn:s=>{
      const avail=s.mechanics.filter(m=>!m.sick);
      if(!avail.length)return null;
      const m=pick(avail); m.sick=true; m.sickDays=8+rnd(0,16);
      return m.name;
    }},
  {w:2, text:()=>"Weather's grounded half the schedule today. Fewer aircraft coming in.", fn:s=>{s.weatherSlow=24;return "handled";}},
  {w:1, text:()=>"A parts shipment has gone missing in transit.", fn:s=>{s.partsBlocked=12+rnd(0,12);return "handled";}}
];
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(arr){return arr[rnd(0,arr.length-1)];}
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}
function money(n){return "£"+Math.round(n).toLocaleString("en-GB");}
function hhmm(h){const hh=Math.floor(h)%24;return String(hh).padStart(2,"0")+":00";}
function spark(data,color,w,h){
  if(!data||data.length<2) return `<svg width="${w}" height="${h}"></svg>`;
  const mx=Math.max(...data,1),mn=Math.min(...data,0),r=(mx-mn)||1;
  const pts=data.map((v,i)=>`${(i/(data.length-1)*w).toFixed(1)},${(h-2-(v-mn)/r*(h-4)).toFixed(1)}`).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polygon points="0,${h} ${pts} ${w},${h}" fill="${color}22"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6"/></svg>`;
}

let s = newState();
function newState(){
  return {
    day:1, hour:6, speed:1, paused:false,
    cash:60000, rep:50, rank:0, jobsDone:0,
    certs:{airframe:true, powerplant:false, avionics:false},
    wideBay:false,
    bays:[1,2,3,4].map(id=>({id,job:null,mech:null,progress:0,broken:false,repairIn:0})),
    mechanics:[mkMech(3,["airframe"])],
    candidates:[],
    queue:[],
    parts:60, partsBlocked:0,
    weatherSlow:0,
    eventCooldown:30,
    loan:0,
    ledger:{revenue:0,wages:0,parts:0,trade:0,interest:0,misc:0},
    lastLedger:null,
    periodStartDay:1,
    hist:{cash:[],rep:[],jobs:[]},
    rivals: RIVAL_SEED.map(([n,b,r])=>mkRival(n,b,r)),
    tab:"hangar",
    log:[]
  };
}
function mkMech(skill, certs){
  const name = pick(FIRST)+" "+pick(LAST);
  const wage = Math.round((400+skill*180)*(1+certs.length*0.25));
  return {id:Math.random().toString(36).slice(2,9), name, skill, certs, wage, fatigue:0, sick:false, sickDays:0};
}
function mkRival(name,bays,rep){
  return {id:Math.random().toString(36).slice(2,9), name, bays, rep, cash:40000+rnd(0,80000), jobsDone:rnd(5,80), partsMul:0.8+Math.random()*0.5};
}
function refreshCandidates(){
  s.candidates = [1,2,3].map(()=>{
    const skill = rnd(1,5);
    const pool=["airframe","powerplant","avionics"].filter(()=>Math.random()<0.35);
    return mkMech(skill, pool);
  });
}
refreshCandidates();

function addLog(level,text){
  s.log.unshift({level, text, t:`D${s.day} ${hhmm(s.hour)}`});
  if(s.log.length>120) s.log.length=120;
}
function toast(level,text){
  const d=document.createElement("div");
  d.className="toast "+level; d.textContent=text;
  document.getElementById("toasts").prepend(d);
  setTimeout(()=>d.remove(),5500);
  const wrap=document.getElementById("toasts");
  while(wrap.children.length>4) wrap.lastChild.remove();
}
addLog("good", `${RANKS[0]} day one. Four bays, one wrench, a town full of aircraft that need you.`);

function spawnJobChance(){
  if(s.weatherSlow>0) return;
  const base = 0.09 + s.rep/650;
  if(Math.random()>base) return;
  if(s.queue.length>=8) return;
  let keys = Object.keys(JOB_TYPES).filter(k=>{
    const jt=JOB_TYPES[k];
    if(jt.wide && !s.wideBay) return false;
    if(jt.cert && !s.certs[jt.cert]) return false;
    return true;
  });
  const key = Math.random()<0.08 ? "AOG" : pick(keys.length?keys:["LINE"]);
  const jt = JOB_TYPES[key];
  const job = {
    id: Math.random().toString(36).slice(2,9), key,
    name: jt.name, hours: jt.hours, pay: Math.round(jt.pay*(0.9+Math.random()*0.3)),
    cert: jt.cert, parts: jt.parts, wide: !!jt.wide,
    aircraft: pick(jt.aircraft)+" · "+pick(AIRLINES),
    spawnedAt: s.day*24+s.hour,
    deadline: jt.deadline ? s.day*24+s.hour+jt.deadline : null
  };
  s.queue.push(job);
  if(job.key==="AOG") toast("warn", `AOG: ${job.aircraft} needs attention fast.`);
}

function tryAssign(jobId, bayId, mechId){
  const job = s.queue.find(j=>j.id===jobId);
  const bay = s.bays.find(b=>b.id===bayId);
  const mech = s.mechanics.find(m=>m.id===mechId);
  if(!job||!bay||!mech) return;
  if(bay.broken){toast("bad","That bay is out of service."); return;}
  if(bay.job){toast("bad","That bay is occupied."); return;}
  if(mech.sick){toast("bad",mech.name+" is off sick."); return;}
  if(mech.job){toast("bad",mech.name+" is already on a job."); return;}
  if(job.wide && !s.wideBay){toast("bad","No wide-body bay yet."); return;}
  if(job.cert && !mech.certs.includes(job.cert)){toast("bad",mech.name+" isn't rated for that check."); return;}
  if(s.parts < job.parts){toast("bad","Not enough parts in stock for this job."); return;}
  s.parts -= job.parts;
  s.queue = s.queue.filter(j=>j.id!==jobId);
  bay.job = job; bay.progress = 0; bay.mech = mech.id;
  mech.job = job.id;
  addLog("info", `${mech.name} started ${job.name} on ${job.aircraft} in Bay ${bay.id}.`);
}

function tick(){
  s.hour++;
  if(s.weatherSlow>0) s.weatherSlow--;
  if(s.partsBlocked>0) s.partsBlocked--;
  if(s.eventCooldown>0) s.eventCooldown--;
  if(s.hour>=24){ s.hour=0; s.day++; dailyRollover(); }

  for(const b of s.bays){
    if(b.broken){ b.repairIn--; if(b.repairIn<=0){b.broken=false; addLog("good",`Bay ${b.id} is back in service.`);} continue; }
    if(b.job && b.mech){
      const mech = s.mechanics.find(m=>m.id===b.mech);
      let rate = mech.skill;
      if(mech.fatigue>80) rate *= 0.5;
      b.progress += rate;
      mech.fatigue = Math.min(100, mech.fatigue+3);
      if(b.progress >= b.job.hours){
        completeJob(b, mech);
      }
    }
  }
  for(const m of s.mechanics){
    if(!m.job){ m.fatigue = Math.max(0, m.fatigue-5); }
    if(m.sick){ m.sickDays--; if(m.sickDays<=0){m.sick=false; addLog("good", m.name+" is back on shift.");} }
  }
  const now = s.day*24+s.hour;
  s.queue = s.queue.filter(j=>{
    if(j.deadline && now>j.deadline){
      s.rep = Math.max(0, s.rep-6);
      addLog("bad", `AOG on ${j.aircraft} missed its slot. Diverted. Reputation -6.`);
      toast("bad","Missed an AOG deadline.");
      return false;
    }
    return true;
  });

  spawnJobChance();
  if(s.eventCooldown<=0 && Math.random() < 0.05){
    const ev = weightedEvent();
    const label = ev.fn(s);
    if(label){
      addLog("warn", ev.text(label));
      toast("warn", ev.text(label));
    }
    s.eventCooldown = 60 + rnd(0,60);
  }
  checkMilestone();
  render();
}
function weightedEvent(){
  const total = EVENTS.reduce((a,e)=>a+e.w,0);
  let r = Math.random()*total;
  for(const e of EVENTS){ if(r<e.w) return e; r-=e.w; }
  return EVENTS[0];
}
function completeJob(bay, mech){
  const job = bay.job;
  s.cash += job.pay;
  s.ledger.revenue += job.pay;
  s.jobsDone++;
  let repGain = job.key==="AOG" ? 3 : job.key==="C" ? 2.5 : 1;
  s.rep = Math.min(100, s.rep + repGain);
  addLog("good", `${mech.name} signed off ${job.name} on ${job.aircraft}. +${money(job.pay)}, reputation +${repGain}.`);
  if(job.key==="AOG" || job.pay>=7000) toast("good", `${job.name} complete — ${money(job.pay)}`);
  bay.job=null; bay.progress=0; bay.mech=null;
  mech.job=null;
}
function dailyRollover(){
  const wages = s.mechanics.reduce((a,m)=>a+m.wage,0);
  s.cash -= wages;
  s.ledger.wages -= wages;
  addLog("info", `Day ${s.day} begins. Wages paid: ${money(wages)}.`);
  if(s.cash < -20000){
    addLog("bad", "The bank's called. You're deep in the red.");
    toast("bad","Cash is critically low.");
  }
  // contractors expire
  for(const m of s.mechanics){
    if(m.contractor){
      m.contractDaysLeft--;
      if(m.contractDaysLeft<=0){
        if(m.job){ const bay=s.bays.find(b=>b.mech===m.id); if(bay){bay.job=null;bay.mech=null;bay.progress=0;} }
      }
    }
  }
  s.mechanics = s.mechanics.filter(m=>!(m.contractor && m.contractDaysLeft<=0));
  // rivals drift
  for(const r of s.rivals){
    r.jobsDone += rnd(0,3);
    r.rep = clamp(r.rep + rnd(-2,3), 10, 95);
    r.partsMul = clamp(r.partsMul + (Math.random()-0.5)*0.15, 0.6, 1.4);
    r.cash = Math.max(0, r.cash + rnd(-5000,9000));
  }
  if(s.day%30===0 && s.loan>0){
    const interest = Math.round(s.loan*0.0075);
    s.cash -= interest; s.ledger.interest -= interest;
    addLog("warn", `Monthly loan interest charged: ${money(interest)}.`);
  }
  if(s.day - s.periodStartDay >= 7){
    s.lastLedger = {...s.ledger};
    s.ledger = {revenue:0,wages:0,parts:0,trade:0,interest:0,misc:0};
    s.periodStartDay = s.day;
  }
  s.hist.cash.push(s.cash); s.hist.rep.push(Math.round(s.rep)); s.hist.jobs.push(s.jobsDone);
  if(s.hist.cash.length>60){s.hist.cash.shift();s.hist.rep.shift();s.hist.jobs.shift();}
  if(Math.random()<0.3) refreshCandidates();
}
function checkMilestone(){
  const ms = MILESTONES[s.rank];
  if(!ms) return;
  if(s.jobsDone>=ms.jobs && s.rep>=ms.rep){
    s.cash += ms.bonus;
    if(ms.unlock) s.certs[ms.unlock]=true;
    if(ms.wideBay) s.wideBay=true;
    s.rank++;
    addLog("good", `Promoted to ${RANKS[s.rank]}. ${ms.text} [+${money(ms.bonus)}]`);
    toast("good", `Promoted: ${RANKS[s.rank]}`);
  }
}

// ---------- trade / bank ----------
function rivalPartsPrice(r){return Math.round(170*r.partsMul);}
function buyFromRival(id,qty){
  const r=s.rivals.find(x=>x.id===id); if(!r)return;
  const cost=rivalPartsPrice(r)*qty;
  if(s.cash<cost){toast("bad","Not enough cash.");return;}
  s.cash-=cost; s.parts+=qty; s.ledger.trade-=cost;
  addLog("info",`Bought ${qty} parts from ${r.name} for ${money(cost)}.`);
}
function sellToRival(id,qty){
  const r=s.rivals.find(x=>x.id===id); if(!r)return;
  if(s.parts<qty){toast("bad","Not enough parts to sell.");return;}
  const pay=Math.round(rivalPartsPrice(r)*0.75)*qty;
  s.parts-=qty; s.cash+=pay; s.ledger.trade+=pay;
  addLog("info",`Sold ${qty} parts to ${r.name} for ${money(pay)}.`);
}
function subcontract(rivalId,jobId){
  const r=s.rivals.find(x=>x.id===rivalId); const job=s.queue.find(j=>j.id===jobId);
  if(!r||!job)return;
  const pay=Math.round(job.pay*0.55);
  s.queue=s.queue.filter(j=>j!==job); s.cash+=pay; s.rep=Math.max(0,s.rep-1); s.ledger.trade+=pay;
  addLog("warn",`Subcontracted ${job.name} on ${job.aircraft} to ${r.name} for ${money(pay)} (reputation -1).`);
  toast("warn","Job subcontracted out.");
}
function hireContractor(rivalId){
  const r=s.rivals.find(x=>x.id===rivalId); if(!r)return;
  const fee=2500+rnd(0,1500);
  if(s.cash<fee){toast("bad","Not enough cash.");return;}
  s.cash-=fee; s.ledger.trade-=fee;
  const m=mkMech(rnd(2,4),["airframe"]); m.contractor=true; m.contractDaysLeft=1; m.name+=" (contractor)";
  s.mechanics.push(m);
  addLog("info",`Hired a day contractor from ${r.name}: ${m.name}.`);
}
function loanLimit(){ return Math.max(60000, 50000+s.jobsDone*2500); }
function borrowLoan(amount){
  const room = loanLimit()-s.loan;
  if(room<=0){toast("bad","At your loan limit.");return;}
  amount=Math.min(amount,room);
  s.loan+=amount; s.cash+=amount;
  addLog("info",`Drew down ${money(amount)} of loan facility.`);
}
function repayLoan(amount){
  amount=Math.min(amount,s.loan,Math.max(0,s.cash));
  if(amount<=0){toast("bad","Nothing to repay with.");return;}
  s.loan-=amount; s.cash-=amount;
  addLog("info",`Repaid ${money(amount)} of the loan.`);
}

// ---------- rendering ----------
const TABS = [["hangar","Hangar"],["mechanics","Mechanics"],["jobs","Job Queue"],["parts","Parts"],["rivals","Rivals"],["finance","Finance"],["bank","Bank"],["stats","Stats"],["career","Career"],["log","Log"]];
function renderTabs(){
  document.getElementById("tabs").innerHTML = TABS.map(([id,name])=>
    `<button class="btn ${s.tab===id?'on':''}" data-tab="${id}">${name}${id==='jobs'&&s.queue.length?` <span class="pill">${s.queue.length}</span>`:''}</button>`
  ).join("");
}
function stars(n){return '<span class="stars">'+'★'.repeat(n)+'</span><span class="muted">'+'★'.repeat(5-n)+'</span>';}

function renderHangarMap(){
  const cells = s.bays.map(b=>{
    const cls = b.broken?"broken":b.job?"busy":"";
    const icon = b.broken ? "🛠" : b.job ? "✈" : "";
    return `<div class="baycell ${cls}"><span class="num">${b.id}</span><span class="ac">${icon}</span>
      <span>${b.broken?"OUT":b.job?b.job.name:"idle"}</span></div>`;
  }).join("");
  const waiting = s.queue.slice(0,10).map(j=>`<span class="plane ${j.deadline?'aog':''}">${j.aircraft.split(" · ")[0]}</span>`).join("")
    || '<span class="muted">Apron clear.</span>';
  return `<div class="hangarmap">
    <div class="floor">${cells}</div>
    <div class="apron"><b style="font-family:var(--headfont);color:var(--amber);letter-spacing:1px;text-transform:uppercase;font-size:12px">Apron — waiting</b><div style="margin-top:8px">${waiting}</div></div>
  </div>`;
}
function renderHangar(){
  return `<h2 class="title">Hangar — ${s.bays.length} bays${s.wideBay?' · wide-body capable':''}</h2>
  ${renderHangarMap()}
  <div class="grid">
    ${s.bays.map(b=>{
      if(b.broken) return `<div class="card"><b>Bay ${b.id}</b><div class="bad">Out of service — back in ${b.repairIn}h</div></div>`;
      if(!b.job) return `<div class="card"><b>Bay ${b.id}</b><div class="emptybay">Idle — assign a job from the queue</div></div>`;
      const mech = s.mechanics.find(m=>m.id===b.mech);
      const pct = Math.min(100, b.progress/b.job.hours*100);
      return `<div class="card"><div class="row between"><b>Bay ${b.id}</b><span class="pill">${b.job.name}</span></div>
        <div class="muted">${b.job.aircraft}</div>
        <div class="muted">Mechanic: ${mech?mech.name:"?"}</div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="muted">${Math.round(pct)}% · ${Math.max(0,Math.ceil(b.job.hours-b.progress))}h left</div>
      </div>`;
    }).join("")}
  </div>`;
}
function renderMechanics(){
  const rows = s.mechanics.map(m=>`
    <div class="card"><div class="row between">
      <span><b>${m.name}</b> ${stars(m.skill)} ${m.sick?'<span class="pill bad">sick</span>':m.job?'<span class="pill cyan">on job</span>':'<span class="pill good">idle</span>'}</span>
      <span class="muted">${money(m.wage)}/day</span></div>
      <div class="row">${m.certs.map(c=>`<span class="pill cert">${c}</span>`).join("")||'<span class="muted">no ratings</span>'}</div>
      <div class="muted">Fatigue: ${m.fatigue}${m.fatigue>80?' — mistakes likely':''}</div>
      <div class="bar ${m.fatigue>80?'red':m.fatigue>50?'amber':''}"><i style="width:${m.fatigue}%"></i></div>
      ${m.contractor?'<span class="pill warn">contractor · leaves tonight</span>':`<button class="btn danger" data-fire="${m.id}">Let go</button>`}
    </div>`).join("");
  const cand = s.candidates.map(c=>`
    <div class="card"><div class="row between">
      <span><b>${c.name}</b> ${stars(c.skill)}</span><span class="muted">${money(c.wage)}/day</span></div>
      <div class="row">${c.certs.map(x=>`<span class="pill cert">${x}</span>`).join("")||'<span class="muted">no ratings yet</span>'}</div>
      <button class="btn primary" data-hire="${c.id}">Hire</button>
    </div>`).join("");
  return `<h2 class="title">Mechanics (${s.mechanics.length})</h2><div class="grid">${rows}</div>
  <h2 class="title">Candidates</h2><div class="grid">${cand}</div>`;
}
function renderJobs(){
  if(!s.queue.length) return `<h2 class="title">Job Queue</h2><p class="muted">Nothing waiting. More work arrives as your reputation grows.</p>`;
  return `<h2 class="title">Job Queue (${s.queue.length})</h2><div class="grid">
    ${s.queue.map(j=>{
      const now = s.day*24+s.hour;
      const freeBays = s.bays.filter(b=>!b.job&&!b.broken&&(!j.wide||s.wideBay));
      const freeMechs = s.mechanics.filter(m=>!m.job&&!m.sick&&(!j.cert||m.certs.includes(j.cert)));
      const deadlineTxt = j.deadline ? `<div class="${now>j.deadline-3?'bad':'warn'}">Deadline in ${Math.max(0,j.deadline-now)}h</div>` : "";
      return `<div class="card"><div class="row between"><b>${j.name}</b><span class="good">${money(j.pay)}</span></div>
        <div class="muted">${j.aircraft}</div>
        <div class="muted">${j.hours}h · needs ${j.parts} parts${j.cert?` · requires ${j.cert} rating`:''}</div>
        ${deadlineTxt}
        ${freeBays.length && freeMechs.length ? `
          <div class="row">
            <select data-bay-for="${j.id}">${freeBays.map(b=>`<option value="${b.id}">Bay ${b.id}</option>`).join("")}</select>
            <select data-mech-for="${j.id}">${freeMechs.map(m=>`<option value="${m.id}">${m.name}</option>`).join("")}</select>
            <button class="btn primary" data-assign="${j.id}">Assign</button>
          </div>` : `<div class="muted">No free bay or qualified, rested mechanic available.</div>`}
      </div>`;
    }).join("")}
  </div>`;
}
function renderParts(){
  return `<h2 class="title">Parts Inventory</h2>
  <div class="card"><div class="row between"><b>On the shelf</b><span>${s.parts} units</span></div>
  <div class="bar ${s.parts<15?'red':''}"><i style="width:${Math.min(100,s.parts)}%"></i></div>
  ${s.partsBlocked>0?`<p class="warn">Shipment delayed — restocking blocked for ${s.partsBlocked}h.</p>`:""}
  <div class="row" style="margin-top:8px">
    <button class="btn" data-buy="10">+10 (£${10*180})</button>
    <button class="btn" data-buy="50">+50 (£${50*170})</button>
    <button class="btn" data-buy="150">+150 (£${150*160})</button>
  </div></div>
  <p class="muted">Each job consumes parts on assignment. Run dry and you can't take on work, however many bays are free. Rivals (see the Rivals tab) sometimes sell cheaper.</p>`;
}
function renderRivals(){
  return `<h2 class="title">Rival Shops</h2>
  <p class="muted">Other MROs working the same airport. Trade with them, or offload work you can't staff.</p>
  <div class="grid">
  ${s.rivals.map(r=>{
    const price = rivalPartsPrice(r);
    const jobOpts = s.queue.map(j=>`<option value="${j.id}">${j.name} — ${j.aircraft.split(" · ")[0]}</option>`).join("");
    return `<div class="card"><h3>${r.name}</h3>
      <div class="row between"><span class="muted">Bays</span><b>${r.bays}</b></div>
      <div class="row between"><span class="muted">Reputation</span><b>${Math.round(r.rep)}</b></div>
      <div class="row between"><span class="muted">Checks done</span><b>${r.jobsDone}</b></div>
      <div class="row between"><span class="muted">Parts price</span><b>${money(price)}/unit</b></div>
      <div class="row" style="margin-top:6px">
        <button class="btn" data-buyrival="${r.id}" data-qty="10">Buy 10 parts</button>
        <button class="btn" data-sellrival="${r.id}" data-qty="10">Sell 10 parts</button>
        <button class="btn" data-contractor="${r.id}">Hire day contractor</button>
      </div>
      ${s.queue.length?`<div class="row" style="margin-top:6px">
        <select data-subjob="${r.id}">${jobOpts}</select>
        <button class="btn warn" data-subcontract="${r.id}">Subcontract job</button>
      </div>`:'<p class="muted">No jobs in your queue to subcontract right now.</p>'}
    </div>`;
  }).join("")}
  </div>`;
}
function ledgerRow(label,cur,last){
  return `<tr><td>${label}</td><td class="n ${cur<0?'bad':cur>0?'good':''}">${money(cur)}</td><td class="n muted">${last!==null?money(last):"–"}</td></tr>`;
}
function renderFinance(){
  const L=s.ledger, LL=s.lastLedger;
  const total = o=>Object.values(o).reduce((a,b)=>a+b,0);
  return `<h2 class="title">Finance</h2>
  <p class="muted">Tallied over a rolling 7-day period. Resets each Monday of the game clock.</p>
  <table><tr><th></th><th class="n">This period</th><th class="n">Last period</th></tr>
    ${ledgerRow("Revenue (checks signed off)", L.revenue, LL?LL.revenue:null)}
    ${ledgerRow("Wages", L.wages, LL?LL.wages:null)}
    ${ledgerRow("Rival trade (net)", L.trade, LL?LL.trade:null)}
    ${ledgerRow("Loan interest", L.interest, LL?LL.interest:null)}
    ${ledgerRow("Fines & misc", L.misc, LL?LL.misc:null)}
    <tr style="font-weight:700"><td>Net</td><td class="n ${total(L)<0?'bad':'good'}">${money(total(L))}</td><td class="n muted">${LL?money(total(LL)):"–"}</td></tr>
  </table>
  <div class="card" style="margin-top:12px"><h3>Cash on hand</h3><b class="${s.cash<0?'bad':'good'}" style="font-size:22px">${money(s.cash)}</b></div>`;
}
function renderBank(){
  const limit = loanLimit();
  return `<h2 class="title">Bank</h2>
  <div class="card"><div class="row between"><b>Loan facility</b><span>${money(s.loan)} of ${money(limit)}</span></div>
  <div class="bar"><i style="width:${Math.min(100,s.loan/limit*100)}%"></i></div>
  <p class="muted">0.75% interest charged on the 30th of every game month. Your limit grows as you complete more checks.</p>
  <div class="row">
    <button class="btn" data-borrow="25000">Borrow £25,000</button>
    <button class="btn" data-borrow="50000">Borrow £50,000</button>
    <button class="btn" data-repay="25000">Repay £25,000</button>
    <button class="btn" data-repay="999999999">Repay all</button>
  </div></div>`;
}
function renderStats(){
  return `<h2 class="title">Statistics</h2>
  <div class="card"><h3>Cash — history</h3>${spark(s.hist.cash,"#4fe0a0",380,54)}</div>
  <div class="card"><h3>Reputation — history</h3>${spark(s.hist.rep,"#45d6c2",380,54)}</div>
  <div class="card"><h3>Checks completed — cumulative</h3>${spark(s.hist.jobs,"#ff7a3d",380,54)}</div>
  <div class="grid">
    <div class="card"><div class="muted">Checks done</div><b style="font-size:20px">${s.jobsDone}</b></div>
    <div class="card"><div class="muted">Days running</div><b style="font-size:20px">${s.day}</b></div>
    <div class="card"><div class="muted">Mechanics</div><b style="font-size:20px">${s.mechanics.length}</b></div>
    <div class="card"><div class="muted">Reputation</div><b style="font-size:20px">${Math.round(s.rep)}</b></div>
  </div>`;
}
function renderCareer(){
  const ms = MILESTONES[s.rank];
  return `<h2 class="title">Career — ${RANKS[s.rank]}</h2>
  <div class="row">${RANKS.map((r,i)=>`<span class="pill ${i<s.rank?'good':i===s.rank?'cyan':''}">${i+1}. ${r}</span>`).join("")}</div>
  <div class="card" style="margin-top:10px">
    ${ms ? `<h3>Next: ${RANKS[s.rank+1]}</h3>
      <div>Checks signed off: <b>${s.jobsDone}</b> / ${ms.jobs}</div>
      <div class="bar"><i style="width:${Math.min(100,s.jobsDone/ms.jobs*100)}%"></i></div>
      <div>Reputation: <b>${Math.round(s.rep)}</b> / ${ms.rep}</div>
      <div class="bar ${s.rep>=ms.rep?'':'amber'}"><i style="width:${Math.min(100,s.rep/ms.rep*100)}%"></i></div>
      <p class="muted">On promotion: ${money(ms.bonus)}${ms.unlock?` · ${ms.unlock} rating unlocked`:''}${ms.wideBay?' · wide-body bay unlocked':''}</p>`
    : `<p class="good">You've reached the top of the ladder. Keep the hangar running.</p>`}
  </div>`;
}
function renderLog(){
  return `<h2 class="title">Log</h2><div class="log">${s.log.map(l=>`<div class="${l.level}"><span class="muted">${l.t}</span> ${l.text}</div>`).join("")}</div>`;
}
function render(){
  document.getElementById("s-day").textContent = s.day;
  document.getElementById("s-time").textContent = hhmm(s.hour);
  document.getElementById("s-cash").textContent = money(s.cash);
  document.getElementById("s-cash").className = s.cash<0 ? "bad" : "good";
  document.getElementById("s-rep").textContent = Math.round(s.rep);
  document.getElementById("s-rank").textContent = RANKS[s.rank];
  document.getElementById("s-jobs").textContent = s.jobsDone;
  document.getElementById("p-pause").classList.toggle("on", s.paused);
  document.getElementById("p-1").classList.toggle("on", s.speed===1&&!s.paused);
  document.getElementById("p-2").classList.toggle("on", s.speed===2&&!s.paused);
  document.getElementById("p-4").classList.toggle("on", s.speed===4&&!s.paused);
  renderTabs();
  const fns = {hangar:renderHangar, mechanics:renderMechanics, jobs:renderJobs, parts:renderParts, rivals:renderRivals, finance:renderFinance, bank:renderBank, stats:renderStats, career:renderCareer, log:renderLog};
  document.getElementById("main").innerHTML = fns[s.tab]();
}

document.addEventListener("click", e=>{
  const t = e.target;
  if(t.dataset.tab){ s.tab=t.dataset.tab; render(); }
  else if(t.id==="p-pause"){ s.paused=!s.paused; render(); }
  else if(t.id==="p-1"){ s.speed=1; s.paused=false; render(); }
  else if(t.id==="p-2"){ s.speed=2; s.paused=false; render(); }
  else if(t.id==="p-4"){ s.speed=4; s.paused=false; render(); }
  else if(t.dataset.hire){
    const c = s.candidates.find(x=>x.id===t.dataset.hire);
    if(c){ s.mechanics.push(c); s.candidates=s.candidates.filter(x=>x!==c); addLog("info",`Hired ${c.name}.`); render(); }
  }
  else if(t.dataset.fire){
    const m = s.mechanics.find(x=>x.id===t.dataset.fire);
    if(m && confirm(`Let ${m.name} go?`)){
      if(m.job){ const bay=s.bays.find(b=>b.mech===m.id); if(bay){bay.job=null;bay.mech=null;bay.progress=0;} }
      s.mechanics = s.mechanics.filter(x=>x!==m); addLog("warn",`${m.name} has left the hangar.`); render();
    }
  }
  else if(t.dataset.buy){
    const n = Number(t.dataset.buy);
    const cost = n===10?10*180:n===50?50*170:150*160;
    if(s.partsBlocked>0){ toast("bad","Shipment delayed — can't restock yet."); return; }
    if(s.cash<cost){ toast("bad","Not enough cash."); return; }
    s.cash -= cost; s.parts += n; s.ledger.parts -= cost; addLog("info",`Bought ${n} parts for ${money(cost)}.`); render();
  }
  else if(t.dataset.assign){
    const jobId = t.dataset.assign;
    const card = t.closest(".card");
    const bayId = Number(card.querySelector(`[data-bay-for="${jobId}"]`).value);
    const mechId = card.querySelector(`[data-mech-for="${jobId}"]`).value;
    tryAssign(jobId, bayId, mechId);
    render();
  }
  else if(t.dataset.buyrival){ buyFromRival(t.dataset.buyrival, Number(t.dataset.qty)); render(); }
  else if(t.dataset.sellrival){ sellToRival(t.dataset.sellrival, Number(t.dataset.qty)); render(); }
  else if(t.dataset.contractor){ hireContractor(t.dataset.contractor); render(); }
  else if(t.dataset.subcontract){
    const rivalId = t.dataset.subcontract;
    const card = t.closest(".card");
    const jobId = card.querySelector(`[data-subjob="${rivalId}"]`).value;
    if(jobId) subcontract(rivalId, jobId);
    render();
  }
  else if(t.dataset.borrow){ borrowLoan(Number(t.dataset.borrow)); render(); }
  else if(t.dataset.repay){ repayLoan(Number(t.dataset.repay)); render(); }
});

setInterval(()=>{ if(!s.paused) tick(); }, 900);
render();
</script>
</body>
</html>
